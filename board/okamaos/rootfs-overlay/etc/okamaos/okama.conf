# OkamaOS main config  (/etc/okamaos/okama.conf)
# Plain key=value.  Read by okama-cli, okama-shell, okama-run at startup.

VERSION=1.1.0
CODENAME=Cyber Hardware Readiness

# Display
DISPLAY_MODE=framebuffer       # framebuffer | drm | x11 (x11 unsupported)
FRAMEBUFFER_DEVICE=/dev/fb0
TARGET_FPS=30

# Audio
AUDIO_BACKEND=alsa
DEFAULT_VOLUME=80

# Input
CONTROLLER_PREFER=usb          # usb | bluetooth | auto
SYSTEM_KEYBOARD_ENABLED=yes    # shell, games, and terminal/dev flows
KEYBOARD_FALLBACK=yes          # compatibility alias for older tooling

# Bluetooth
BLUETOOTH_ENABLED=auto         # auto | yes | no
BT_SCAN_TIMEOUT=30
BT_AUTO_RECONNECT=yes

# Network
NETWORK_ENABLED=yes
WIFI_ENABLED=no
INTERNET_PROBE_TIMEOUT_SEC=0.75

# Updates
UPDATE_FEED_URL=https://zyntrixsolutions.github.io/okamaos/updates/feed.json
APP_CATALOG_URL=https://zyntrixsolutions.github.io/okamaos/catalog/apps.json
UPDATE_CHECK_ENABLED=yes
UPDATE_CHECK_TIMEOUT_SEC=2
UPDATE_BACKUP_DIR=/var/okamaos/updates/backups
UPDATE_HISTORY_DIR=/var/okamaos/updates/history

# Paths
GAMES_DIR=/var/okamaos/games
SAVES_DIR=/var/okamaos/saves
LOGS_DIR=/var/okamaos/logs
CACHE_DIR=/var/okamaos/cache
UPDATES_DIR=/var/okamaos/updates
CONTROLLERS_DIR=/var/okamaos/controllers

# Security
DEVELOPER_MODE=no              # changed by okama-cli dev enable/disable
PARENT_MODE_ENABLED=yes

# Performance
MAX_GAME_RAM_MB=1800
IDLE_RAM_BUDGET_MB=250

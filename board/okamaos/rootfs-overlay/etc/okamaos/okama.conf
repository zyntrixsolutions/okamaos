# OkamaOS main config  (/etc/okamaos/okama.conf)
# Plain key=value.  Read by okama-cli, okama-shell, okama-run at startup.

VERSION=0.9.4
CODENAME=Keyboard Ready

# Display
DISPLAY_MODE=framebuffer       # framebuffer | drm | x11 (x11 unsupported)
FRAMEBUFFER_DEVICE=/dev/fb0
TARGET_FPS=30

# Audio
AUDIO_BACKEND=alsa
DEFAULT_VOLUME=80

# Input
CONTROLLER_PREFER=usb          # usb | bluetooth | auto
KEYBOARD_FALLBACK=yes          # emergency navigation only

# Bluetooth
BLUETOOTH_ENABLED=no           # auto-set to yes if paired controllers exist
BT_SCAN_TIMEOUT=30
BT_AUTO_RECONNECT=yes

# Network
NETWORK_ENABLED=yes
WIFI_ENABLED=no

# Paths
GAMES_DIR=/var/okamaos/games
SAVES_DIR=/var/okamaos/saves
LOGS_DIR=/var/okamaos/logs
CACHE_DIR=/var/okamaos/cache
UPDATES_DIR=/var/okamaos/updates
CONTROLLERS_DIR=/var/okamaos/controllers

# Security
DEVELOPER_MODE=no              # changed by okama-cli dev enable/disable
PARENT_MODE_ENABLED=yes

# Performance
MAX_GAME_RAM_MB=1800
IDLE_RAM_BUDGET_MB=250

# OkamaOS developer mode config
# Written/removed by: okama-cli dev enable|disable
# DO NOT commit this file with ENABLED=yes to the production rootfs overlay.

ENABLED=no

# When yes, the following become available:
#   - tty2 getty with full keyboard input
#   - debug overlays in okama-shell (RAM, FPS, input events)
#   - okama-pack inspect / verify on unsigned .ok files
#   - unsigned .ok install without parent PIN (still logged)
#   - Q key quits current demo/test app
SHOW_DEBUG_OVERLAY=no
ALLOW_UNSIGNED_RUN=no
ALLOW_SHELL_ESCAPE=no
LOG_LEVEL=warn                 # debug | info | warn | error
